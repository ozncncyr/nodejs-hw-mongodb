
  tags:
    - contacts
  summary: Get contact by ID
  operationId: getContactById
  description: Retrieve a contact by its unique ID.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
      description: Contact ID
  responses:
    '200':
      description: Contact found
      content:
        application/json:
          schema:
            $ref: ../../../components/schemas/contact.yaml
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Contact not found
              data:
                type: "null"
