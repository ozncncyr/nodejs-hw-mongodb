
  tags:
    - contacts
  summary: Update contact by ID (partial)
  operationId: updateContact
  description: Update specific fields of a contact by its ID.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
      description: Contact ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/contact.yaml'
  responses:
    '200':
      description: Contact updated successfully
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/contact.yaml'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Contact not found
              data:
                type: "null"
