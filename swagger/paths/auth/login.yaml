post:
  tags:
    - auth
  summary: Login a user
  operationId: loginUser
  description: Authenticate user and return access token.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            email:
              type: string
            password:
              type: string
          required:
            - email
            - password
  responses:
    '200':
      description: User logged in successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/login.yaml'
    '404':
      description: Login failed
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Login failed
              data:
                type: "null"
