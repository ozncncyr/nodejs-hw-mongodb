post:
  tags:
    - auth
  summary: Register a new user
  operationId: registerUser
  description: Create a new user account.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            password:
              type: string
          required:
            - name
            - email
            - password
  responses:
    '200':
      description: User registered successfully
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/register.yaml'
    '404':
      description: Registration failed
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Registration failed
              data:
                type: null
